<!-- ============================================================
     CORNICE DINAMICA — LINGUE FACILI (embed LEGGERO · Blogger o qualsiasi sito)
     ------------------------------------------------------------
     ✏️  Versione minima (~5 KB): iframe + altezza dinamica + font
         OpenDyslexic caricati dall'app via CORS. Titolo fisso
         «LINGUE FACILI», URL fisso dell'app.

     📏  Altezza dinamica: protocollo labvisivo:height + ping
         (famiglia «LabVisivo»). Se l'app non lo supporta, la cornice
         mantiene l'altezza di default (640px).

     🎨  Colori allineati all'app: carta #f8f1e4, inchiostro #2e2018.

     ⭐  Per l'embed completo (schermo intero, ricarica, stato
         online/errore, anti-loop) usa embed-lingue-facili-dedicata.html.
     ============================================================ -->
<style>
  #efEmbed {
    background: #f8f1e4;
    border: 1px solid rgba(46, 32, 24, 0.15);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    font-family: 'OpenDyslexic', 'Cambria', 'Times New Roman', Georgia, serif;
    margin: 0 auto;
    max-width: 800px;
    overflow: hidden;
  }
  #efEmbedHead {
    align-items: center;
    background: #f8f1e4;
    border-bottom: 2px solid rgba(46, 32, 24, 0.08);
    display: flex;
    gap: 10px;
    justify-content: space-between;
    padding: 12px 20px;
  }
  #efEmbedTitle {
    color: #2e2018;
    flex: 1;
    font-family: 'OpenDyslexic', 'Cambria', 'Times New Roman', Georgia, serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
    line-height: 1.3;
    margin: 0;
    text-align: center;
  }
  #efEmbedOpen {
    color: #2e2018;
    font-size: 13px;
    font-weight: 700;
    opacity: 0.6;
    text-decoration: none;
    transition: opacity 0.2s ease;
    white-space: nowrap;
  }
  #efEmbedOpen:hover { opacity: 1; }
  #francaisFacileIframe {
    border: none;
    display: block;
    height: 640px;
    min-width: 100%;
    width: 1px;
  }
  @media (max-width: 480px) {
    #efEmbedHead { padding: 10px 12px; }
    #efEmbedTitle { font-size: 14px; letter-spacing: 1.5px; }
    #efEmbedOpen { font-size: 12px; }
  }
</style>

<div id="efEmbed">
  <div id="efEmbedHead">
    <div id="efEmbedTitle">LINGUE FACILI</div>
    <a id="efEmbedOpen" href="#" target="_blank" rel="noopener">Apri ↗</a>
  </div>
  <iframe id="francaisFacileIframe" title="Lingue Facili — app in cornice" src="about:blank" allow="camera; microphone"></iframe>
</div>

<script>
  /* ================= ⚙️ CONFIGURAZIONE — DEDICATA a Lingue Facili ================= */
  var APP_URL   = 'https://lingue-facili.easy-peasy.site/';   // ← cambia SOLO qui per un'altra app
  var APP_TITLE = 'LINGUE FACILI';                                  // ← (facoltativo) titolo in cornice
  /* ================================================================================ */

  (function () {
    'use strict';

    /* 1) Se l'URL è passato come parametro (?app=... o ?url=...), ha la precedenza */
    var qs = new URLSearchParams(window.location.search);
    var paramUrl = qs.get('app') || qs.get('url');
    if (paramUrl && /^https?:\/\//i.test(paramUrl)) APP_URL = paramUrl;
    if (qs.get('title')) APP_TITLE = qs.get('title');

    /* Normalizza: l'URL deve terminare con "/" per concatenare i percorsi */
    APP_URL = APP_URL.replace(/\/?$/, '/');

    /* 2) Font OpenDyslexic serviti dall'app stessa (stesso dominio dell'iframe) */
    var fs = document.createElement('style');
    fs.textContent =
      "@font-face{font-family:'OpenDyslexic';src:url('" + APP_URL + "fonts/OpenDyslexic-Regular-v2.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}" +
      "@font-face{font-family:'OpenDyslexic';src:url('" + APP_URL + "fonts/OpenDyslexic-Bold-v2.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}";
    document.head.appendChild(fs);

    /* 3) Titolo, link "apri" e src dell'iframe */
    var titleEl = document.getElementById('efEmbedTitle');
    var openEl  = document.getElementById('efEmbedOpen');
    var iframe  = document.getElementById('francaisFacileIframe');
    if (titleEl) titleEl.textContent = APP_TITLE;
    if (openEl)  openEl.href = APP_URL;
    if (iframe) {
      iframe.src = APP_URL;
      iframe.title = APP_TITLE + ' — app in cornice';
    }

    /* 4) Altezza dinamica: l'app risponde al ping con { type: "labvisivo:height" } */
    window.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'labvisivo:height' && typeof e.data.height === 'number') {
        if (e.data.height > 100) iframe.style.height = e.data.height + 'px';
      }
    });
    setTimeout(function () {
      try {
        if (iframe.contentWindow) iframe.contentWindow.postMessage({ type: 'labvisivo:ping' }, '*');
      } catch (err) { /* app non ancora pronta o dominio diverso: resta l'altezza di default */ }
    }, 800);
  })();
</script>
